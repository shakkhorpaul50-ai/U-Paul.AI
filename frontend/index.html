<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>U_Paul-AI — 260M Bangla + English Chat</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; background: #0f1420; color: #e8ecf4; }
  header { padding: 12px 16px; background: #161d2e; border-bottom: 1px solid #2a3550; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  header h1 { font-size: 18px; margin: 0; }
  header small { color: #8fa0c0; }
  #auth { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  #auth img { width: 28px; height: 28px; border-radius: 50%; }
  #auth .who { font-size: 13px; color: #c6d2ea; }
  #auth .role { font-size: 11px; color: #8fa0c0; border: 1px solid #2a3550; border-radius: 6px; padding: 2px 6px; }
  #status { font-size: 12px; color: #8fa0c0; }
  #chat { max-width: 760px; margin: 0 auto; padding: 16px; padding-bottom: 90px; }
  .msg { margin: 10px 0; padding: 10px 12px; border-radius: 10px; line-height: 1.5; white-space: pre-wrap; }
  .user { background: #1e2a45; margin-left: 60px; }
  .bot { background: #1a2236; margin-right: 60px; border: 1px solid #2a3550; }
  .meta { font-size: 11px; color: #8fa0c0; margin-top: 6px; }
  #locked { max-width: 760px; margin: 40px auto; text-align: center; color: #8fa0c0; }
  #bar { position: fixed; bottom: 0; left: 0; right: 0; background: #161d2e; border-top: 1px solid #2a3550; padding: 10px; display: flex; gap: 8px; max-width: 760px; margin: 0 auto; }
  #prompt { flex: 1; background: #0f1420; color: #e8ecf4; border: 1px solid #2a3550; border-radius: 8px; padding: 10px; }
  button { background: #3b6fe0; color: #fff; border: 0; border-radius: 8px; padding: 10px 16px; cursor: pointer; }
  button:disabled { opacity: .5; cursor: wait; }
  button.ghost { background: transparent; border: 1px solid #2a3550; }
</style>
</head>
<body>
<header>
  <h1>U_Paul-AI</h1>
  <small>260M Bangla + English + Code (by Shakkhor Paul)</small>
  <span id="status">checking model…</span>
  <div id="auth"></div>
</header>
<div id="chat"></div>
<div id="locked" style="display:none">
  <p>Chatting needs login.</p>
  <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
    <input id="lname" placeholder="name (register)" autocomplete="name" style="background:#0f1420;color:#e8ecf4;border:1px solid #2a3550;border-radius:8px;padding:10px">
    <input id="lemail" type="email" placeholder="email" autocomplete="email" style="background:#0f1420;color:#e8ecf4;border:1px solid #2a3550;border-radius:8px;padding:10px">
    <input id="lpass" type="password" placeholder="password (8+ chars)" autocomplete="current-password" style="background:#0f1420;color:#e8ecf4;border:1px solid #2a3550;border-radius:8px;padding:10px">
  </div>
  <div style="margin-top:10px;display:flex;gap:8px;justify-content:center">
    <button onclick="doAuth('login')">Login</button>
    <button class="ghost" onclick="doAuth('register')">Register</button>
  </div>
  <p id="autherr" style="color:#f0888f"></p>
</div>
<div id="bar" style="display:none">
  <input id="prompt" placeholder="হ্যালো লিখুন বা ask anything…" autocomplete="off">
  <button id="send">Send</button>
</div>
<script>
const chat = document.getElementById('chat');
const promptEl = document.getElementById('prompt');
const sendBtn = document.getElementById('send');
const statusEl = document.getElementById('status');
const authEl = document.getElementById('auth');
const barEl = document.getElementById('bar');
const lockedEl = document.getElementById('locked');

if (location.hash.startsWith('#token=')) {
  localStorage.setItem('up_token', location.hash.slice(7));
  location.hash = '';
}
const token = () => localStorage.getItem('up_token') || '';
const headers = () => ({'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token()});

async function health() {
  try {
    const r = await fetch('/health');
    const j = await r.json();
    statusEl.textContent = j.loaded ? 'model ready (' + j.model + ')' : (j.loading ? 'model loading…' : ('error: ' + (j.error || 'not loaded')));
  } catch (e) { statusEl.textContent = 'backend offline'; }
}
setInterval(health, 5000); health();

async function me() {
  if (!token()) { lockedEl.style.display = 'block'; return; }
  try {
    const r = await fetch('/api/me', {headers: headers()});
    if (!r.ok) throw 0;
    const j = await r.json();
    authEl.innerHTML = '';
    if (j.picture) { const img = document.createElement('img'); img.src = j.picture; authEl.appendChild(img); }
    const who = document.createElement('span'); who.className = 'who'; who.textContent = j.name || j.email; authEl.appendChild(who);
    const role = document.createElement('span'); role.className = 'role'; role.textContent = j.role; authEl.appendChild(role);
    const out = document.createElement('button'); out.className = 'ghost'; out.textContent = 'Logout';
    out.onclick = () => { localStorage.removeItem('up_token'); location.reload(); };
    authEl.appendChild(out);
    lockedEl.style.display = 'none';
    barEl.style.display = 'flex';
  } catch (e) {
    localStorage.removeItem('up_token');
    lockedEl.style.display = 'block';
  }
}
me();

function add(text, cls, meta) {
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  d.textContent = text;
  if (meta) { const m = document.createElement('div'); m.className = 'meta'; m.textContent = meta; d.appendChild(m); }
  chat.appendChild(d);
  window.scrollTo(0, document.body.scrollHeight);
}

async function send() {
  const prompt = promptEl.value.trim();
  if (!prompt || !token()) return;
  promptEl.value = '';
  sendBtn.disabled = true;
  add(prompt, 'user');
  try {
    const r = await fetch('/api/chat', {
      method: 'POST',
      headers: headers(),
      body: JSON.stringify({prompt})
    });
    const j = await r.json();
    if (r.status === 401) { localStorage.removeItem('up_token'); location.reload(); return; }
    if (!r.ok) add('Error: ' + (j.error || r.status), 'bot');
    else add(j.reply, 'bot', (j.skill || '') + ' · ' + (j.ms || 0) + 'ms');
  } catch (e) { add('Error: ' + e.message, 'bot'); }
  sendBtn.disabled = false;
}
sendBtn.onclick = send;
promptEl.onkeydown = e => { if (e.key === 'Enter') send(); };
async function doAuth(mode) {
  const err = document.getElementById('autherr');
  err.textContent = '';
  const email = document.getElementById('lemail').value.trim();
  const password = document.getElementById('lpass').value;
  const name = document.getElementById('lname').value.trim();
  try {
    const r = await fetch('/api/' + mode, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({email, password, name})
    });
    const j = await r.json();
    if (!r.ok) { err.textContent = j.error || ('Failed: ' + r.status); return; }
    localStorage.setItem('up_token', j.token);
    me();
  } catch (e) { err.textContent = 'Error: ' + e.message; }
}
</script>
</body>
</html>
